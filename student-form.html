<section id="student-form-view">
  <h2 id="form-title">Добавить студента</h2>

  <form id="student-form">
    <input type="hidden" id="student-id">

    <p>
      <label for="fullName">ФИО студента *</label><br>
      <input type="text" id="fullName" required minlength="2">
    </p>

    <p>
      <label for="group">Группа *</label><br>
      <input type="text" id="group" required pattern="[A-Za-zА-Яа-я][0-9]{4}" maxlength="5" title="Одна буква и 4 цифры, например P3211">
    </p>

    <p>
      <label for="isuId">ИСУ ID *</label><br>
      <input type="text" id="isuId" required pattern="[345][0-9][1-5][0-9]{3}" inputmode="numeric" maxlength="6" title="6 цифр: первая 3, 4 или 5; третья от 1 до 5">
    </p>

    <p>
      <label for="dormNumber">Номер общежития *</label><br>
      <input type="number" id="dormNumber" required min="1">
    </p>

    <p>
      <label for="room">Комната *</label><br>
      <input type="number" id="room" required min="1">
    </p>

    <p>
      <label for="checkInDate">Срок заселения *</label><br>
      <input type="date" id="checkInDate" required min="2020-01-01">
    </p>

    <p>
      <label>
        <input type="checkbox" id="isForeigner">
        Студент является иностранцем
      </label>
    </p>

    <p>
      <label for="notes">Заметки</label><br>
      <textarea id="notes" rows="4"></textarea>
    </p>

    <p id="form-errors"></p>
    <button type="submit">Сохранить</button>
    <button type="button" data-action="back">Отмена</button>
  </form>
</section>
